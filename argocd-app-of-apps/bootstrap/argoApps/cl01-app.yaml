apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cl01
  annotations:
    argocd.argoproj.io/sync-wave: "10"  
  namespace: kim-argocd
spec:
  project: default
  source:
    repoURL: https://github.com/maxiepax/vks-consumption-models.git
    path: argocd-app-of-apps/clusters/cl01
    targetRevision: main
  destination:
    name: sp-lab-supervisor
    namespace: workload-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true