apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-2
  namespace: kim-argocd-drx5d
  finalizers:
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  project: default
  source:
    repoURL: https://github.com/maxiepax/vks-consumption-models.git
    path: argocd-app-of-apps/workloads/cl01/online-boutique
    targetRevision: main
    directory:
      recurse: true
  destination:
    name: cl01                    # matches the registered cluster name
    namespace: online-boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: privileged
