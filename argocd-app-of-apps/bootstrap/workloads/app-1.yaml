apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-1
  namespace: kim-argocd-drx5d
  finalizers:
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/maxiepax/vks-consumption-models.git
    path: argocd-app-of-apps/workloads/cl01/nginx
    targetRevision: main
    directory:
      recurse: true
  destination:
    name: cl01                    # matches the registered cluster name
    namespace: demo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
